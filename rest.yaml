- resource: "https://www.stockholmvattenochavfall.se/villa-och-radhus/avfallstjanster/nar-kommer-sopbilen/Search?address=Storgatan%201,%20Stockholm,%2011444"
  scan_interval: 7200
  headers:
    User-Agent: "Mozilla/5.0"
    Accept: "application/json"
  sensor:
    # ==========================================
    # 1. RESTAVFALL och MATAVFALL
    # ==========================================
    - name: "Soptömning Restavfall Datum"
      unique_id: soptomning_restavfall_datum
      icon: mdi:trash-can
      value_template: >
        {% set ns = namespace(val='Ej aktiv') %}
        {% for item in value_json %}
          {% if 'restavfall' in item.group %}
            {% set ns.val = item.executionDate %}
          {% endif %}
        {% endfor %}
        {{ ns.val }}

    - name: "Soptömning Restavfall Frekvens"
      unique_id: soptomning_restavfall_frekvens
      icon: mdi:update
      value_template: >
        {% set ns = namespace(val='Okänd') %}
        {% for item in value_json %}
          {% if 'restavfall' in item.group %}
            {% set ns.val = item.fetchFrequency %}
          {% endif %}
        {% endfor %}
        {{ ns.val }}

    - name: "Soptömning Restavfall Veckodag"
      unique_id: soptomning_restavfall_veckodag
      icon: mdi:calendar-today
      value_template: >
        {% set ns = namespace(val='Okänd') %}
        {% for item in value_json %}
          {% if 'restavfall' in item.group %}
            {% set ns.val = item.weekday %}
          {% endif %}
        {% endfor %}
        {{ ns.val }}

